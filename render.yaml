# Render Blueprint (https://render.com/docs/blueprint-spec) for the FREE instance type, which the
# hosted demo uses. Free web services cannot have a persistent disk, so the SQLite database and
# uploads live in ./data inside the instance and are lost on every redeploy, restart or spin-down
# (after about 15 idle minutes). Nothing needs seeding: /demo creates a fresh deal on each visit,
# the sample clips ship in samples/, and the PayPal webhook is found or re-created at boot.
# The daily AI call count also restarts with the instance.
# render.starter.yaml is the same service on Starter with a 1 GB disk; see the README to upgrade.
services:
  - type: web
    name: sauda
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: GEMINI_BACKEND
        value: vertex
      - key: GEMINI_FAST_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-4-argon
      - key: GEMINI_FAST_TIMEOUT_MS
        value: "8000"
      - key: GEMINI_FALLBACK_TIMEOUT_MS
        value: "30000"
      - key: AI_DAILY_CALL_LIMIT
        value: "500"
      # Secrets: entered in the Render dashboard when the Blueprint is created, never committed.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_EMAIL
        sync: false
      - key: PAYPAL_BUYER_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
